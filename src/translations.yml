aboutUsHeader:
  title: "iyzico Hakkında"
  desc: "internetten alışveriş deneyimini hem alıcılar hem de satıcılar için kolaylaştıran bir finans teknolojileri şirketidir."
  secOneTitle: "iyzico;"
  secOneDesc: "2013’te farklı büyüklüklerdeki şirketlere e-ticaret dünyasında sanal POS hizmeti ve yapay zeka tabanlı ödeme teknolojileri sunmak amacıyla kuruldu. Basit ve güvenli platformu ile karmaşık ödeme alma süreçlerini kolaylaştıran iyzico, kısa süre içerisinde binlerce şirketin dijitalleşmesine katkı sağlayarak büyük başarılara imza attı ve 2019 yılında dünya ödeme devi <a href='https://corporate.payu.com' target='_blank' title='PayU'>PayU</a> tarafından satın alındı. iyzico, bu güçlü yapıyla birlikte şirketlere sunduğu hizmetlerin yanı sıra finansal hizmetleri demokratikleştirmek ve herkes için ulaşabilir kılmak amacıyla çalışmalarını sürdürüyor."
  secTwoTitle: "iyzico Korumalı Alışveriş"
  secTwoDesc: "Tüketicilerin internet alışverişlerine karşı duyduğu endişelere çözüm sunuluyor ve daha iyi bir deneyim yaşamaları sağlanıyor. iyzico mobil uygulaması üzerinden 7/24 canlı destek ve iptal/iade süreçlerindeki kolaylıklar ile kontrol tüketicilere geri veriliyor. Bugüne kadar 2 milyondan fazla tüketici, internet alışverişlerini iyzico Korumalı Alışveriş güvencesiyle gerçekleştirdi ve bu sayı her geçen gün artmaya devam ediyor. Karma bir ödeme çözümü olan iyzico ile Öde ürünüyle ise bankacılık hizmeti almayan milyonlarca tüketicinin, iyzico Korumalı Alışveriş güvencesiyle internetten alışveriş yapabilmesi sağlanıyor.<strong>iyzico; geliştirdiği kolay, erişilebilir ve yenilikçi teknolojilerle internet alışverişlerini hem tüketiciler hem de satıcılar için kolaylaştırmaya devam ediyor.</strong>"

iyziLifeBusiness:
  secOne: "<h3>Sanal POS ile<span class='orange-pink'> sitenizden ödeme alın.</span></h3><p>24 saat içerisinde web sitenizden ödeme almaya başlamak mı istiyorsunuz? Öyleyse iyzico Sanal POS ile tanışmanızın şimdi tam zamanı.</p>"
  secTwo: "<h3>Entegrasyonsuz Link Yöntemi ile kolayca<span class='macaroni-and-cheese'> ödeme alın</span></h3><p>Şu ürünlerimizi internetten satalım da nasıl ödeme alacağız? diyorsanız, doğru yerdesiniz. Kurumsal ve bireysel binlerce satıcı iyzico Link Yöntemi ile ödemelerini kolayca ve güvenle alıyor. Üstelik bunun için hiçbir entegrasyona ihtiyacınız yok!</p>"
  secThree: "<h3>iyzico Korumalı Alışveriş<span class='blueberry'> ile daha fazla kazanın</span></h3><p>Güvenli internet alışverişinin tanımı iyzico Korumalı Alışveriş ile müşterilerinize 7/24 canlı destek sunarak operasyonel yükünüzü azaltabilir ve kazancınızı artırabilirsiniz.</p>"
  secFour: "<h3>iyzico ile Öde sayesinde<span class='clear-blue'> yeni müşterilerinizle tanışın</span></h3><p>iyzico ile Öde avantajlarıyla hiçbir bankacılık hizmetinden yararlanmayan tüketicilerden dahi ödeme alabilir ve yeni müşterilerinizle tanışabilirsiniz.</p>"

