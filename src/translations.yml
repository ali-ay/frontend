  secOneTitle: "iyzico Korumalı Alışveriş ile "
  secOneTitleColor: "Yeni Müşteriler Kazanın"
  secOneDesc: "Üye iş yerleri, iyzico Korumalı Alışveriş avantajlarıyla müşteri sayısını artırdı."
