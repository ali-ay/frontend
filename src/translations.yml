femaleHeaderContent:
  title: "<h1><strong>Tüm Desteğimizle </strong><span>#KadınGirişimcinin Yanındayız</span></h1><p>Üreten kadınlara iş hayatına giriş aşamasında komisyon, eğitim ve tanıtım desteği sunuyoruz. E-ticaret dünyasında çok daha büyük işler başarabilmeleri için her adımda yanlarında oluyoruz!<br><br>Yeni başvuru dönemi pek yakında! Gelişmeler için sosyal medyada bizi takip edin.</p><span>Bu sırada <a href='#femaleGeneralinfo'>başvuru koşulları</a>na ve iş ortaklarımızın sunduğu <a href='#femalePrivilege'>avantajlar</a>a göz atabilirsiniz.</span>"

femaleExplanation:
  content: "<p class='heroDesc'>#KadınGirişimcininYanındayız avantajlarından faydalanabilmek için <strong>başvurunuzu yalnızca bu sayfa üzerinden</strong> gerçekleştirmelisiniz.</p><p class='title'>Finansal hizmetleri demokratikleştirme amacıyla çıktığımız bu yolda, tüm desteğimizle kadın girişimcilerin yanındayız!</p><p>Hayallerinin peşinden gitmek isteyen binlerce kadın girişimciye destek oluyoruz. Politika Analiz Laboratuvarı ile beraber hazırladığımız Dijital Finansal Kapsayıcılık Raporu’yla da ülkedeki kadın-erkek istihdam eşitsizliğinin altını çizdik ve ekonomik özgürlüğünün peşindeki kadınlara yönelik faydalar üretmeye odaklandık.<br><br>Üreten kadınlar her alanda varlar ve koşullar ne olursa olsun üretmeye de devam ediyorlar. İşte bu üretimi “İyiden İyiye” büyütmek ve kadın girişimcilerimizin geleceğe sağlam adımlar atabilmelerine destek olmak adına, onlara iş hayatlarına girişte komisyon, eğitim ve tanıtım desteği sunuyoruz.<br><br>Kadınların her alandaki varlığının güçlenmesiyle daha güzel günlerin geleceğine inanarak; eşitlik sağlanana kadar <strong>#KadınGirişimcininYanındayız</strong></p>"

femalePrivilege:
  title: "Kadın Girişimcileri Hangi Avantajlar Bekliyor?"
  fb: "Kadın Girişimcileri Hangi Avantajlar Bekliyor?"
  secOne: "<h3>İlk 6 Ay<span class='clear-blue'> 0 Komisyon</span></h3><p>Tek çekim ödemelerde 100.000 TL işlem hacmine kadar <strong>0 komisyon</strong> ile kadın girişimcilerimize finansal destek sunuyoruz.</p>"
  secTwo: "<h3>Ücretsiz<span class='greyish-teal'> Eğitimler</span></h3><p>Partnerimiz Google ile birlikte kadın girişimcilerimize dijital pazarlama ve online satış alanlarında ücretsiz eğitimler veriyoruz.</p>"
  secThree: "<h3>Tanıtım<span class='yellow-orange'> Desteği</span></h3><p>Programa dahil olan kadın girişimcilerimize tanıtım desteği sunuyoruz ve onlara binlerce yeni potansiyel müşteri kazandırıyoruz.</p>"
