  figureOne: "<h4>Banka Hesabın Olmadan <span class='tiffany-blue'>Alışveriş Yap</span></h4><p>iyzico bakiyeni oluştur ve 40 binden fazla sitede banka hesabın olmadan alışverişe başla.</p>"
  figureTwo: "<h4>7/24 <br/><span class='clear-blue'>Canlı Destek</span></h4><p>iyzico Korumalı Alışveriş kapsamındaki tüm alışverişlerinde, 7/24 canlı destek seninle.</p>"
  figureThree: "<h4>İptal/İade <span class='yellow-orange'>Süreçlerinde Kolaylık</span></h4><p>İadelerin satıcı onayının ardından anında iyzico hesabınızda!</p>"
  subDesc: "Tüm bu avantajlar için şimdi iyzico hesabını aç; kolay ve güvenli alışverişin keyfini sen de yaşa."
