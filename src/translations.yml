openSourceContent:
  title: "Hızlıca Entegrasyona Başlayın"
  secOne: "Woocommerce, e-ticaret dünyasına hızlı bir giriş yapmak isteyenler için pratik ve kullanışlı bir çözümdür. Wordpress ile entegre çalışan Woocommerce, kurulduktan sonra e-ticaret yapmaya olanak sağlıyor."
  secTwo: "OpenCart, anahtar teslim güçlü bir e-ticaret scriptidir. Opencart’ın hızlı kurulumu ve 6000′den fazla modülü sayesinde, işletmeler düşük bir maliyet ile hazır tema ve modülleri kendi web siteleri için kolaylıkla düzenleyebilir ve geliştirebilirler."
  secThree: "Prestashop, 2007 yılında küçük ve orta ölçekli işletmelerin kullanabileceği bir e-ticaret yazılımı olarak piyasaya sürülmüştür. E-ticaret scriptleri arasında ücretsiz, kaliteli ve gelişmiş bir çözümdür. "
  secFour: "Magento, açık kaynaklı ve özgür bir e-ticaret web uygulamasıdır. Binlerce çözüm ortağı tarafından desteklenen ve dünya çapında 150.000’den fazla işletme tarafından kullanılan açık kaynak kodlu e-ticaret platformudur."

openSourceWhyiyzico:
  secOne: "<h3><span class='clear-blue'>Hızlı</span> Entegrasyon</h3><p>E-ticaret modüllerine özel geliştirdiğimiz eklentilerle ödeme entegrasyonunuzu tamamlamak şimdi kolay! </p>"
  secTwo: "<h3><span class='greyish-teal'>24 Saatte Ödeme</span> Almaya Başlayın</h3><p>Hızlı entegrasyon süreci ile ödemelerinizi 24 saat içinde iyzico ile almaya başlayabilirsiniz.</p>"
