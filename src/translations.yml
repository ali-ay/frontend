dynamic3dsHeaderContent:
  titleBold: "Ödemeleriniz 3DS Doğrulamasına "
  titleLight: "Takılmasın"
  desc: "iyzico Dynamic 3DS sistemi, yapay zeka teknolojisiyle yalnızca riskli bulduğu ödemeleri 3DS doğrulamasına yönlendirerek müşterilerinize daha iyi bir ödeme deneyimi sunmanızı sağlar ve size daha fazlasını kazandırır."

dynamic3dsProgress:
  title: "iyzico Dynamic 3DS <br>Nasıl Daha Fazla Kazanmanızı Sağlıyor?"
  desc: "3DS doğrulaması, harcama itirazı gibi durumların önüne geçebilmek için alınan bir güvenlik önlemi olarak görülse de ödemelerin başarı oranını olumsuz anlamda etkilemektedir ve müşterilerinize daha kötü bir ödeme deneyimi sunmanıza sebep olmaktadır. Her 5 geçerli ödemeden 1’i, 3DS doğrulama aşamasında kaybediliyor. Peki çözüm ne? iyzico Dynamic 3DS sistemi, yalnızca riskli gördüğü ödemeleri doğrulama aşamasına yönlendirir. Güvenli ödemeleriniz ise saniyeler içerisinde tek tıkla başarılı bir şekilde sonuçlanır."

dynamic3dsPrivileges:
  secOneTitleColor: "Yeni Nesil Ödeme Teknolojileriyle "
  secOneTitle: "Daha Fazla Kazanın"
  secOneDesc: "iyzico Dynamic 3DS sistemi sayesinde ödemeler artık çok daha kolay ve hızlı. iyzico’nun yapay zeka tabanlı ödeme teknolojileriyle müşterilerinize daha iyi bir deneyim sunun ve daha fazla kazanın.<br><br>Üye iş yerlerimizden küresel bir spor ürünleri markasının, 5 aylık bir süreçte Dynamic 3DS Sistemi ile satış dönüşüm oranlarında %10’luk bir artış sağladığını biliyor muydunuz?"

smartPaymentHeaderContent:
  titleBold: "Akıllı Ödeme Yönlendirme ile "
  titleLight: "Daha Fazla Kazanın"
  desc: "iyzico Akıllı Ödeme Yönlendirme Servisi, başarısız olabilecek ödemelerinizi milisaniyeler içerisinde farklı bir banka POS’undan geçirerek başarılı işleme dönüştürür ve size ekstra kazanç sağlar. Siz de şimdi iyzico üye iş yeri olun ve iyzico Akıllı Ödeme Yönlendirme Servisi’nden ücretsiz yararlanın."

smartPaymentProgress:
  title: "iyzico Akıllı Ödeme Yönlendirme Servisi Size Nasıl Daha Fazla Kazandırıyor?"
  desc: "Zaman zaman farklı altyapısal sebeplerle ödemeler başarısız olabilir. Ancak bir iyzico üye iş yeriyseniz, bu ödemeleri kaybetmezsiniz. iyzico Akıllı Ödeme Yönlendirme Servisi, hiçbir aksiyon almanıza gerek kalmadan başarısız olabilecek ödemelerinizi milisaniyeler içerisinde otomatik olarak farklı bir banka POS’undan geçirerek başarılı işleme dönüştürür ve size ekstra kazanç sağlar."

smartPaymentPrivileges:
  secOneTitleColor: "Geçerli Ödemelerinizi "
  secOneTitle: "Kaybetmeyin"
  secOneDesc: "iyzico Akıllı Ödeme Yönlendirme Servisi ile geçerli ödemelerinizi kaybetmeden işlerinizi büyütmeye devam edin! iyzico’nun yapay zeka tabanlı ödeme teknolojileriyle müşterilerinize daha iyi bir deneyim sunun, yeni nesil ödeme teknolojileriyle daha fazlasını kazanın."

