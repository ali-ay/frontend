fraudHeaderContent:
  titleBold: "Sizi Sahteciliğe Karşı Koruyor, "
  titleLight: "Gelirinizi Artırıyoruz"
  desc: "iyzico tarafından geliştirilen yapay zekâ destekli sahtecilik önleme sistemimiz sayesinde, geçerli ödemeleri kaçırmadan şüpheli işlemlere karşı üye iş yerlerimizi koruyor, harcama itirazlarınızı düşürerek müşteri memnuniyetini artırıyoruz."

fraudPrivileges:
  secOneTitle: "Son Teknolojiyi "
  secOneTitleColor: "Ücretsiz Kullanın"
  secOneDesc: "BDDK Lisansı ve PCI - DSS sertifikasına sahip olan iyzico’nun uzman mühendisleri, TÜBİTAK destekli projeler kapsamında yeni nesil teknolojiler geliştiriyor. Yapay zeka tabanlı güvenlik sistemi ile sahtecilik işlemlerine karşı her zaman korunacak, harcama itirazı (chargeback) riskinizi en aza indirecek ve gelirinizi artırabileceksiniz."
  secTwoTitle: "Başarılı Ödeme Oranınızı ve "
  secTwoTitleColor: "Gelirinizi Artırın"
  secTwoDesc: "Milyonlarca ödeme verisiyle eğitilen ve sürekli gelişen yapay zekâ sayesinde, gerçek ödemeler ve sahtecilik işlemleri arasındaki fark kolayca tespit edilir. Bu sayede, başarılı ödemeler kısıtlanmadan sadece şüpheli işlemlere karşı anlık olarak korunmuş olursunuz. Ödeme reddetme oranınız düşer, hem başarılı ödeme hem de satış dönüşüm oranlarınız artar."
  secThreeTitle: "Yapay Zeka ile "
  secThreeTitleColor: "Güvenliğinizi Sağlayın"
  secThreeDesc: "Yeni saldırı yöntemleri geliştikçe öğrenen ve böylece güncel saldırılara karşı her zaman hazır olan yapay zekâ ile ödemelerinizin güvenliğini iyzico’ya bırakır, satışlarınıza odaklanabilirsiniz."

fraudProgress:
  title: "Frauctive Sahtecilik Önleme Sistemi Sizi Nasıl Korur?"
  desc: "Tüm iyzico üye iş yerleri ilk günden itibaren yapay zekâ destekli sahtecilik önleme sistemi Frauctive’in güvenlik kontrolü altına girer ve hem siz hem müşterileriniz olası zararlara karşı korunur. Yüzlerce güvenlik filtresi, kara liste verisi (black list data), milyonlarca ödeme verisinden beslenip kendi kendine öğrenen yapay zekâ ve uzman ekibimizle 7/24 tüm kontroller yapılır, şüpheli işlemlere anında müdahale edilir. Bu sayede daha sonra oluşabilecek zararların önüne geçilmiş olur."

businessMarketPlaceHowto:
  secOneTitleColor: "Tüm Altyapılar İçin"
