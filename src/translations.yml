careerItems:
  kadriyeDogan: "&#147;Büyük düşün, küçük başla, hızla ölçekle mantığıyla çalışan bir ekibiz.&#148;"
  enginOzsozgun: "&#147;Üye işyerlerimiz, son kullanıcılarımız ve iyzinatörlerimizle bir orkestra içerisindeki farklı enstrümanlar gibiyiz.&#148;"
  cansuKahyaoglu: "&#147;iyzico’da, alınan kararların altında yatan nedenler her zaman tartışmaya açıktır ve sorgulanır. Ortak bir vizyon ışığında kararlarımızı aksiyona çeviririz.&#148;"
  yaseminBalpinar: "&#147;Gerçek değerimizin temelinde çeşitliliğe olan saygımız yatıyor. iyzico’da kadın, erkek hepimiz eşit olarak temsil ediliyoruz. Burada herkesin kendini geliştirmesi için gerekli imkanlar sağlanır.&#148;"
  burakCamli: "&#147;Her zaman ulaşılabilen ekibimizle üye iş yerlerimizin hızlı, kolay ve güvenli ödeme almalarını sağlıyoruz.&#148;"
  serkanKaraduman: "&#147;Sektör paydaşlarımızla uyum içinde çalışıyor, birlikte geliştirdiğimiz yenilikçi projeler ile fark yaratıyoruz.&#148;"

