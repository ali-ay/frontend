onlineProceedsTestimonial:
  contentOne: "Link ile ödeme alma yöntemi sayesinde misafirlerimiz ödemelerini güvenli bir şekilde tamamlayabiliyorlar. Bu durum da rezervasyon oranlarımızın artışındaki en önemli etkenlerden biri."
  contentOneTitle: "Sibel Kartal | Büyükada Mavi Otel"
  contentTwo: "Online satışlarımızın ödemelerini, alıcılarımızla paylaştığımız link üzerinden istediğimiz zamanda ve istediğimiz yerde alabiliyoruz."
  contentTwoTitle: "Alper Olcay | Sevgilibebek"
  contentThree: "Stant satışlarımıza klasik POS cihazları kullanarak başladık fakat süreci yönetmek oldukça zor ve karışıktı. iyzico Link Yöntemi'nin pratikliği, marka bilinirliği ve karşı tarafa güven vermesi sayesinde hızlı bir şekilde ödeme almaya başladık."

businessSocialMediaTestimonial:
  contentOneName: "Burçin Demir | Art’n Smile"
  contentOne: "Sosyal medya üzerinden gerçekleştirdiğim satışlarımın ödemelerini taksitli veya peşin olarak alabilmek, iş süreçlerimde bana büyük bir kolaylık sağlıyor."
  contentTwoName: "Melis Ekin | Pinkylola Design"
  contentTwo: "Sosyal medya satışlarımızın ödemelerini entegrasyona ihtiyaç duymadan tek bir link üzerinden alabilmemiz, bizi daha ulaşılabilir kıldı ve satışlarımızı gözle görülür derecede artırdı."
  contentThreeName: "Özlem Erarslan | Ravla Gurme"
  contentThree: "Özenle hazırladığımız ürünlerimizi müşterilerimize sunarken, iyzico’nun profesyonel, güvenli ve kolay altyapısı ile tüm dünyaya ulaşıyoruz."

businessStandSalesTestimonial:
  contentOne: "Stant satışlarımızda iyzico işim için mobil uygulaması üzerinden ürünün ismini ve fiyatını sisteme girerek, telefonumuzu bir POS cihazına dönüştürüyoruz ve ödemelerimizi saniyeler içerisinde alabiliyoruz."
  contentTwo: "Saha satışlarında en fazla ihtiyaç duyduğumuz şeyler kolaylık ve hız. iyzico, saha satışlarımızda adeta ekibimizin bir üyesi gibi çalışıyor ve ödemelerimizi kısa sürede alabilmemiz için bize büyük bir destek sunuyor."

businessBuyerProtectionTestimonial:
  contentOne: "iyzico Korumalı Alışveriş’in sunduğu gerçek zamanlı kargo takibi ve 7/24 canlı destek hizmeti, müşterilerimizle iletişimimizi güçlendirdi ve markamızı daha ulaşılabilir kıldı."
  contentTwo: "iyzico Korumalı Alışveriş’in sitemizde yer alması müşterilerimizin alışveriş yaparken kendini güvende hissetmesini sağlıyor. Bu da satışlarımızı kısa süre içinde artırmamızı sağladı."
  contentThree: "iyzico Korumalı Alışveriş’in kart saklama özelliği sayesinde, müşterilerimiz ödeme işlemlerini birkaç saniyede tamamlayabiliyor. iyzico’nun tüketiciler üzerindeki güven algısı, bize büyük bir avantaj sunuyor."
  contentFour: "iyzico, her adımda bize sunduğu destek ile operasyonel yükümüzü ciddi oranda azalttı. iyzico web sitesinde Korumalı Alışveriş Yapabileceğiniz Siteler sayfasında yer almamız, birçok yeni müşteri kazanmamızı sağladı."

businessReferencessHeaderContent:
  titleBold: "Başarı Hikayelerini Beraber Büyütüyoruz"
  description: "Üye iş yerlerimiz, onlara sunduğumuz destek ve avantajlarla işini büyütüyor. Gelin onlar gibi düşünerek, onlar için sunduğumuz çözümleri bir de kendilerinden dinleyelim."
  qOne: "iyzico altyapısını ikinci el ve sıfır alışveriş kategorimizde kredi kartı ile yapılan ödemelerde kullanıyoruz. iyzico ile olan işbirliğimiz sayesinde müşterilerimize güvenilir ödeme ve para aktarım süreçlerinde pozitif bir deneyim sunabiliyoruz."
  qTwo: "iyzico ile çalışmanın güvenli bir şekilde kredi kartı saklama imkanı, hem kullanıcılara hem de bizlere çok kolay ve akıcı bir deneyim yaşatması gibi pek çok değerli avantajı var. iyzico, müşterilerine kolay ve hızlı bir ürün deneyimi yaşatmak isteyen bizim gibi markalar için güvenilir bir yol arkadaşı."
  qThree: "Herhangi bir sorun yaşandığında iyzico bunu geliştirip daha hızlı dönüş yapabiliyor. Yeni bir hizmete ihtiyacım olduğu zaman bunu iyzico’ya söylüyorum; ekiplerimiz onlarla entegre çalışıyor ve sorunu çözüyor. Kendi ürünlerini müşteri talebine göre sürekli geliştiriyorlar. iyzico içinde muhatabımız var; bankalarda bunu yapmak, muhatap bulmak imkansız."
  qFour: "Şu anda 180 kişilik bir ekibiz ama hayatımızda iyzico olmasaydı, kesinlikle daha çok çalışana ihtiyaç duyardık. Çünkü bankalarla görüşmeler, süreçlerin yönetilmesi, işlemlerin takibi, fraud kontrolü, posların entegre edilmesi ve denetlenmesi gibi yapılması zorunlu işler bu operasyonun bir parçası. Üstelik, maliyeti yüksek ve iş gücü gerektiren işler. iyzico, maliyetlerimizi düşürerek çalışmalarımızı verimli hale getiriyor. Bu sayede, enerjimizi asıl işimiz olan alanlara aktarabiliyoruz."
  qFive: "Müşterilerimiz ile daha güvenli ve kuvvetli bir bağ kurmamıza destek olan, çözüm ve sonuç odaklı yaklaşımlarıyla hızlı ve kolay çözümler üreten iş ortağımız."
  qSix: "Önceki çalıştığım şirketle bir yenileme yapmak istediğimizde 30 sayfalık bir belgeyi doldurmamızı istediler, bunu yapmak istemediğim için iyzico’yu aradım. iyzico yaklaşık 5 saat içinde gereken her şeyi hazırladı ve ödeme kabul edebilecek noktaya geldik."
  qSeven: "Yurtdışı satışlarda hep 3D engeline takılıyorduk, iyzico ile bu sorunu aştık. Yaptığımız cironun yüzde 10 seviyesinde bir kısmı yurtdışından geliyor."

