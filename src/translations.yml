cultureContent:
  title: "iyzico Kültürü"
  desc: "Bizi daima geleceğe taşıyan kültürümüz hakkında daha fazlasını keşfedin."
  contentTitle: "Finansal Hizmetleri Demokratikleştirmek İçin Takım Oyununun Gücüne İnanıyoruz."
  contentDesc: "Finansal hizmetleri demokratikleştirmek ve herkes için ulaşılabilir kılmak için çıktığımız bu yolda, gücümüzü iyzico kültüründen alıyoruz. Şeffaf, çözüm odaklı ve özgürlükçü kültürümüzle geleceğe sağlam adımlar atıyoruz.<br><br><b>Şeffaf</b><br><br>Şeffaflık, iyzico kültürünün taşıyıcı kolonlarından biri. Şirket içerisinde alınan tüm kararlar sebepleriyle birlikte açıklanıyor, aylık şirket toplantılarında son gelişmeler tüm detaylarıyla ekip ile paylaşılıyor. Birbirimize duyduğumuz karşılıklı güven, bizi daha güçlü kılıyor."
  contentDescTwo: "<b>Çözüm Odaklı</b><br><br>Çözüm odaklı yapımız, işlerimizi kolaylaştırıyor. Farklı departmanlardan üyelerin bir araya gelerek oluşturduğu “circle” yapısı, iyzico çatısı altındaki küçük şirketler gibi çalışıyor ve hedeflerimizi daha kolay elde etmemizi sağlıyor.<br><br><b>Özgürlükçü</b><br><br>iyzico’da “freedom under responsibility” kavramına inanıyoruz. Tüm iyzinatorler sorumluluklarının bilinciyle özgürce çalışıyorlar ve bundan keyif alıyorlar. "
  contentTwo: "2010 yılında Almanya’da başlayan bir dostluk, bir sene sonra bir akşam yemeğinde tamamen şekillenerek iş ortaklığına dönüşeceğinin sinyallerini verdi. Ne istediğimizi, ne yapacağımızı ve hepsinden önemlisi nerede yapacağımızı biliyorduk. İyi olacak, işimizi iyi yapacak, iyi insanlarla bir arada olacak, iyi bilinecek ve en güzel hali ile Türkiye’de devam edecektik! 2012 yılının Ekim ayı bizim için ortak hayallerimizin ve bugünkü iyzico’nun başlangıcı oldu."

